
spring.application.name=cartelera
# El puerto: la aplicación se abre en http://localhost:8081
server.port=8081

# ── Base de datos en memoria ─────────────────────────────────────────
# "mem" = vive en la memoria RAM: se crea al arrancar y se BORRA al parar.
spring.datasource.url=jdbc:h2:mem:cartelera
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# create-drop: Hibernate crea las tablas leyendo tus @Entity al arrancar
#              y las borra al parar. Perfecto para clase.
spring.jpa.hibernate.ddl-auto=create-drop
# show-sql: escribe en el log cada consulta SQL. Así se caza el N+1.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# open-in-view: deja que las plantillas y los LibroDTO lean relaciones LAZY
# después de cerrar la transacción. Cómodo para el curso; en producción se
# pone a false y lo que haga falta se trae con join fetch. Se escribe aunque
# true sea el valor por defecto: si no, Spring avisa con un WARN al arrancar
# para que la decisión quede a la vista.
spring.jpa.open-in-view=true

# ── Desarrollo ───────────────────────────────────────────────────────
spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false