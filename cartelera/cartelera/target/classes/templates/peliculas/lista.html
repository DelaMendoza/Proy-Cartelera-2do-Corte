<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('Catálogo')}"></head>
<body>
<header th:replace="~{fragmentos/comunes :: cabecera}"></header>
<nav th:replace="~{fragmentos/comunes :: menu('peliculas')}"></nav>

<main>
    <h2>Catálogo</h2>

    <form method="get" th:action="@{/peliculas}">
        <input type="text" name="buscar" th:value="${buscar}" placeholder="Título...">
        <button type="submit">Buscar</button>
        <a th:href="@{/peliculas/nueva}">Añadir película</a>
    </form>

    <p class="aviso" th:if="${aviso}" th:text="${aviso}">Película añadida</p>

    <p class="resumen" th:unless="${#lists.isEmpty(peliculas)}"
       th:text="|Hay ${#lists.size(peliculas)} película(s) en cartelera|">
        Hay [[${#lists.size(peliculas)}]] películas
    </p>

    <p th:if="${#lists.isEmpty(peliculas)}" class="vacio">
        No hay películas que coincidan con la búsqueda.
    </p>

    <table th:unless="${#lists.isEmpty(peliculas)}">
        <thead>
        <tr>
            <th>#</th>
            <th>Título</th>
            <th>Género</th>
            <th>Estreno</th>
            <th>Clasificación</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pelicula, iter : ${peliculas}"
            th:classappend="${iter.odd} ? 'impar'">
            <td th:text="${iter.count}">1</td>
            <td>
                <a th:href="@{/peliculas/{id}(id=${pelicula.id})}"
                   th:text="${pelicula.titulo}"
                   th:title="|Ver ficha de ${pelicula.titulo}|">Título</a>

                <small th:unless="${#strings.isEmpty(pelicula.descripcion)}"
                       th:text="${#strings.abbreviate(pelicula.descripcion, 40)}">Descripción</small>
            </td>
            <td th:text="${pelicula.genero}">ACCIÓN</td>
            <td th:text="${pelicula.fechaEstreno != null} ? ${#temporals.format(pelicula.fechaEstreno, 'dd/MM/yyyy')} : '—'">01/01/2024</td>
            <td>
                <span th:switch="${pelicula.clasificacion}">
                    <span th:case="${T(com.project.cartelera.model.Clasificacion).TODO_PUBLICO}">TP</span>
                    <span th:case="${T(com.project.cartelera.model.Clasificacion).MAYORES_DE_7}">+7</span>
                    <span th:case="${T(com.project.cartelera.model.Clasificacion).MAYORES_DE_15}">+15</span>
                    <span th:case="${T(com.project.cartelera.model.Clasificacion).MAYORES_DE_18}" class="adulta">+18</span>
                    <span th:case="*">—</span>
                </span>
            </td>
        </tr>
        </tbody>
    </table>

</main>

<footer th:replace="~{fragmentos/comunes :: pie}"></footer>
</body>
</html>
